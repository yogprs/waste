<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="/static/css/register.css" />
  </head>
  <body class="body-register">
    <!-- TopMenu -->
    <header class="top-menu-container glass-panel">
      <div class="top-menu">
        <h2 class="top-menu-label">Deteksi Sampah</h2>
        <div class="top-menu-list">
          <a class="menu" href="/">Beranda</a>
          <a class="menu" href="/guide">Panduan</a>
          <a class="menu" href="/history">Riwayat Deteksi</a>
        </div>
        <div class="top-menu-right"></div>
      </div>
    </header>
    <!-- Main Content: Registration Canvas -->
    <main class="main-content">
      <div class="content-wrap">
        <!-- Registration Card -->
        <div class="register-card">
          <!-- Subtle Decoration -->
          <div class="sub-deco"></div>
          <div class="register-wrap">
            <h1 class="register-headline">Buat Akunmu</h1>
            <p class="register-description">
              Buat akun untuk menggunakan fitur aplikasi.
            </p>
            <form class="register-form" id="registerForm">
              <!-- Full Name -->
              <div class="input-wrap">
                <label for="name" class="input-label">Nama Lengkap</label>
                <input
                  id="name"
                  name="name"
                  class="input-data"
                  placeholder="John Doe"
                  type="text"
                  autocomplete="name"
                />
              </div>
              <!-- Email Address -->
              <div class="input-wrap">
                <label for="email" class="input-label">Alamat Email</label>
                <input
                  id="email"
                  name="email"
                  class="input-data"
                  placeholder="nama@contoh.com"
                  type="email"
                  autocomplete="email"
                />
              </div>
              <!-- Password Fields Row -->
              <div class="password-fields">
                <div class="input-wrap">
                  <label for="password" class="input-label">Kata Sandi</label>
                  <input
                    id="password"
                    name="password"
                    class="input-data"
                    placeholder="••••••••"
                    type="password"
                  />
                </div>
                <div class="input-wrap">
                  <label for="confirm" class="input-label">Konfirmasi</label>
                  <input
                    id="confirm"
                    name="confirm"
                    class="input-data"
                    placeholder="••••••••"
                    type="password"
                  />
                </div>
              </div>
              <p id="errorMsg" style="color: red"></p>
              <!-- Primary Sign Up Button -->
              <button class="button-register" type="submit">Daftar</button>
            </form>
            <!-- Footer Redirect -->
            <p class="footer-redirect">
              Sudah memiliki akun?
              <a class="redirect-login" href="/login">Login</a>
            </p>
          </div>
        </div>
      </div>
    </main>
    <!-- Footer  -->
    <footer class="footer">
      <div class="footer-wrap">
        <div class="text-footer">© 2026 Deteksi Sampah.</div>
      </div>
    </footer>

    <!-- Mobile Navigation -->
    <nav class="bottom-nav">
      <button class="bottom-nav-button" data-url="/">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        >
          <path
            fill="currentColor"
            d="M6 19h3v-6h6v6h3v-9l-6-4.5L6 10zm-2 2V9l8-6l8 6v12h-7v-6h-2v6zm8-8.75"
          />
        </svg>
        <span class="bottom-nav-text">Beranda</span>
      </button>
      <button class="bottom-nav-button" data-url="/guide">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        >
          <path
            fill="currentColor"
            d="M5 21q-.825 0-1.412-.587T3 19V5q0-.825.588-1.412T5 3h14q.825 0 1.413.588T21 5v14q0 .825-.587 1.413T19 21zM5 5v14h14V5h-2v7l-2.5-1.5L12 12V5zm0 14V5z"
          />
        </svg>
        <span class="bottom-nav-text">Panduan</span>
      </button>
      <button class="bottom-nav-button" data-url="/history">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        >
          <path
            fill="currentColor"
            d="M12 21q-3.45 0-6.012-2.287T3.05 13H5.1q.35 2.6 2.313 4.3T12 19q2.925 0 4.963-2.037T19 12t-2.037-4.962T12 5q-1.725 0-3.225.8T6.25 8H9v2H3V4h2v2.35q1.275-1.6 3.113-2.475T12 3q1.875 0 3.513.713t2.85 1.924t1.925 2.85T21 12t-.712 3.513t-1.925 2.85t-2.85 1.925T12 21m2.8-4.8L11 12.4V7h2v4.6l3.2 3.2z"
          />
        </svg>
        <span class="bottom-nav-text">Riwayat</span>
      </button>
      <button class="bottom-nav-button login" data-url="/login">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        >
          <path
            fill="currentColor"
            d="M12 21v-2h7V5h-7V3h7q.825 0 1.413.588T21 5v14q0 .825-.587 1.413T19 21zm-2-4l-1.375-1.45l2.55-2.55H3v-2h8.175l-2.55-2.55L10 7l5 5z"
          />
        </svg>
        <span class="bottom-nav-text">Login</span>
      </button>
    </nav>

    <script src="/static/js/register.js"></script>
    <script src="/static/js/menuBottom.js"></script>
  </body>
</html>

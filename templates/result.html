<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hasil Deteksi</title>
    <link rel="stylesheet" href="/static/css/result.css" />
  </head>
  <body class="body-result">
    <!-- TopMenu -->
    <header class="top-menu-container glass-panel">
      <div class="top-menu">
        <h2 class="top-menu-label">Deteksi Sampah</h2>
        <div class="top-menu-list">
          <a class="menu" href="/">Beranda</a>
          <a class="menu" href="/guide">Panduan</a>
          <a class="menu" href="/history">Riwayat Deteksi</a>
        </div>
        <div class="top-menu-right">
          <div class="top-menu-text">
            <p class="nav-user-name" id="nav-user-name">-</p>
            <p class="nav-user-description" id="nav-email">-</p>
          </div>
          <div class="nav-profile-wrapper">
            <div class="user-image" id="nav-profile-trigger">
              <img
                class="image-user"
                id="nav-image-user"
                data-alt="image-user"
                src=""
              />
            </div>

            <!-- Dropdown Menu -->
            <div id="nav-profile-menu" class="nav-profile-menu">
              <button class="nav-menu-item" id="dashboard-profile">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                >
                  <path d="M0 0h24v24H0z" fill="none" />
                  <path
                    fill="currentColor"
                    d="M13 9V3h8v6zM3 13V3h8v10zm10 8V11h8v10zM3 21v-6h8v6z"
                  />
                </svg>
                Dasbor
              </button>
              <button class="nav-menu-item" id="open-profile">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                >
                  <path
                    fill="currentColor"
                    d="M5.85 17.1q1.275-.975 2.85-1.537T12 15t3.3.563t2.85 1.537q.875-1.025 1.363-2.325T20 12q0-3.325-2.337-5.663T12 4T6.337 6.338T4 12q0 1.475.488 2.775T5.85 17.1m3.663-5.113Q8.5 10.976 8.5 9.5t1.013-2.488T12 6t2.488 1.013T15.5 9.5t-1.012 2.488T12 13t-2.488-1.012M12 22q-2.075 0-3.9-.788t-3.175-2.137T2.788 15.9T2 12t.788-3.9t2.137-3.175T8.1 2.788T12 2t3.9.788t3.175 2.137T21.213 8.1T22 12t-.788 3.9t-2.137 3.175t-3.175 2.138T12 22"
                  />
                </svg>
                Profile
              </button>
              <button class="nav-menu-item logout">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                >
                  <path
                    fill="currentColor"
                    d="M5 21q-.825 0-1.412-.587T3 19V5q0-.825.588-1.412T5 3h7v2H5v14h7v2zm11-4l-1.375-1.45l2.55-2.55H9v-2h8.175l-2.55-2.55L16 7l5 5z"
                  />
                </svg>
                Logout
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main class="main-container">
      <div class="header-result">
        <h1 class="header-result-headline">Analisa Selesai</h1>
        <p class="header-result-paragraph">
          Analisis sampah mengidentifikasi jenis sampah dan tingkat akurasinya.
        </p>
      </div>
      <!-- Content Grid -->
      <div class="grid-content">
        <!-- Left Side: Detection Image (Visual Context) -->
        <div class="detection-image">
          <div class="detection-image-wrap">
            <img
              id="waste-image"
              alt="result item from detection"
              class="waste-image"
              src=""
            />
          </div>
        </div>
        <!-- Right Side: Details & Actions -->
        <div class="detail-content">
          <!-- Result Card -->
          <div class="result-card">
            <div class="accuracy-container">
              <div class="accuracy-wrap">
                <span class="confidence">Akurasi</span>
                <span class="accuracy" id="accuracy">0%</span>
              </div>
            </div>
            <div class="result-text">
              <span class="waste-type organic">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                >
                  <path
                    fill="currentColor"
                    d="M5.4 19.6Q4.275 18.475 3.637 17T3 13.95t.6-3.112T5.55 7.95q.875-.875 2.163-1.5t3.05-.987t4.025-.438t5.062.175q.2 2.65.125 4.875t-.413 4.013t-.95 3.124T17.1 19.45q-1.325 1.325-2.812 1.938T11.25 22q-1.625 0-3.175-.638T5.4 19.6m2.8-.4q.725.425 1.488.613T11.25 20q1.15 0 2.275-.462t2.15-1.488q.45-.45.913-1.263t.8-2.124t.512-3.175t.05-4.438q-1.225-.05-2.762-.037t-3.063.237t-2.9.725t-2.25 1.375q-1.125 1.125-1.55 2.225T5 13.7q0 1.475.563 2.588t.987 1.562q1.05-2 2.775-3.838T13.35 11q-1.8 1.575-3.137 3.563T8.2 19.2m0 0"
                  />
                </svg>
                Sampah Organik
              </span>
              <span class="waste-type non-organic">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                >
                  <path
                    fill="currentColor"
                    d="m9.2 9.2l2.225-3.675l-1.475-2.45q-.3-.5-.862-.5t-.863.5L5.775 7.15zm9.675 6.8l-2.225-3.7l3.475-2l1.6 2.675q.275.425.3.95t-.225.975q-.25.5-.737.8T20 16zM16 23l-4-4l4-4v2h4.75l-1.45 2.9q-.275.5-.75.8t-1.05.3H16zm-9.675-2q-.5 0-.913-.262T4.8 20.05q-.2-.4-.187-.837t.237-.813L5.7 17H10v4zM3.85 18.15L2.225 14.9q-.225-.45-.213-.962t.288-.963l.4-.675L1 11.275L6.475 9.9l1.375 5.5l-1.725-1.05zm13.5-8.55l-5.475-1.375L13.6 7.2L10.475 2H14q.525 0 .988.263t.737.712l1.3 2.175l1.7-1.05z"
                  />
                </svg>
                Sampah Daur Ulang
              </span>
              <h2 class="type-text" id="type-waste-text">-</h2>
            </div>
            <div class="detail-waste-container">
              <div class="detail-waste-wrap">
                <h3 class="information-label">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                  >
                    <path
                      fill="currentColor"
                      d="M11 17h2v-6h-2zm1.713-8.287Q13 8.425 13 8t-.288-.712T12 7t-.712.288T11 8t.288.713T12 9t.713-.288M12 22q-2.075 0-3.9-.788t-3.175-2.137T2.788 15.9T2 12t.788-3.9t2.137-3.175T8.1 2.788T12 2t3.9.788t3.175 2.137T21.213 8.1T22 12t-.788 3.9t-2.137 3.175t-3.175 2.138T12 22m0-2q3.35 0 5.675-2.325T20 12t-2.325-5.675T12 4T6.325 6.325T4 12t2.325 5.675T12 20m0-8"
                    />
                  </svg>
                  Informasi
                </h3>
                <p class="waste-instruction" id="waste-instruction"></p>
              </div>
            </div>
          </div>
          <!-- Action Buttons -->
          <div class="action-button">
            <button class="new-scan-button" id="new-scan">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
              >
                <path
                  fill="currentColor"
                  d="M12 17.5q1.875 0 3.188-1.312T16.5 13t-1.312-3.187T12 8.5T8.813 9.813T7.5 13t1.313 3.188T12 17.5m0-2q-1.05 0-1.775-.725T9.5 13t.725-1.775T12 10.5t1.775.725T14.5 13t-.725 1.775T12 15.5M4 21q-.825 0-1.412-.587T2 19V7q0-.825.588-1.412T4 5h3.15L9 3h6l1.85 2H20q.825 0 1.413.588T22 7v12q0 .825-.587 1.413T20 21zm0-2h16V7h-4.05l-1.825-2h-4.25L8.05 7H4zm8-6"
                />
              </svg>
              Pemindaian Baru
            </button>
            <button class="history-button" id="history">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
              >
                <path
                  fill="currentColor"
                  d="M12 21q-3.45 0-6.012-2.287T3.05 13H5.1q.35 2.6 2.313 4.3T12 19q2.925 0 4.963-2.037T19 12t-2.037-4.962T12 5q-1.725 0-3.225.8T6.25 8H9v2H3V4h2v2.35q1.275-1.6 3.113-2.475T12 3q1.875 0 3.513.713t2.85 1.924t1.925 2.85T21 12t-.712 3.513t-1.925 2.85t-2.85 1.925T12 21m2.8-4.8L11 12.4V7h2v4.6l3.2 3.2z"
                />
              </svg>
              Lihat Riwayat
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Mobile Navigation -->
    <nav class="bottom-nav">
      <button class="bottom-nav-button" data-url="/dashboard">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        >
          <path
            fill="currentColor"
            d="M13 9V3h8v6zM3 13V3h8v10zm10 8V11h8v10zM3 21v-6h8v6zm2-10h4V5H5zm10 8h4v-6h-4zm0-12h4V5h-4zM5 19h4v-2H5zm4-2"
          />
        </svg>
        <span class="bottom-nav-text">Dasbor</span>
      </button>
      <button class="bottom-nav-button" data-url="/detection">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        >
          <path
            fill="currentColor"
            d="M5 21q-.825 0-1.412-.587T3 19v-4h2v4h4v2zm10 0v-2h4v-4h2v4q0 .825-.587 1.413T19 21zM3 9V5q0-.825.588-1.412T5 3h4v2H5v4zm16 0V5h-4V3h4q.825 0 1.413.588T21 5v4zm-9.825 5.825Q8 13.65 8 12t1.175-2.825T12 8t2.825 1.175T16 12t-1.175 2.825T12 16t-2.825-1.175"
          />
        </svg>
        <span class="bottom-nav-text">Deteksi</span>
      </button>
      <button class="bottom-nav-button" data-url="/history">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        >
          <path
            fill="currentColor"
            d="M12 21q-3.45 0-6.012-2.287T3.05 13H5.1q.35 2.6 2.313 4.3T12 19q2.925 0 4.963-2.037T19 12t-2.037-4.962T12 5q-1.725 0-3.225.8T6.25 8H9v2H3V4h2v2.35q1.275-1.6 3.113-2.475T12 3q1.875 0 3.513.713t2.85 1.924t1.925 2.85T21 12t-.712 3.513t-1.925 2.85t-2.85 1.925T12 21m2.8-4.8L11 12.4V7h2v4.6l3.2 3.2z"
          />
        </svg>
        <span class="bottom-nav-text">Riwayat</span>
      </button>
      <button class="bottom-nav-button logout">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        >
          <path
            fill="currentColor"
            d="M5 21q-.825 0-1.412-.587T3 19V5q0-.825.588-1.412T5 3h7v2H5v14h7v2zm11-4l-1.375-1.45l2.55-2.55H9v-2h8.175l-2.55-2.55L16 7l5 5z"
          />
        </svg>
        <span class="bottom-nav-text">Logout</span>
      </button>
    </nav>

    <!-- Modal Profile -->
    <div id="profile-modal" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Profile</h3>
          <button id="close-modal">&times;</button>
        </div>

        <form id="profile-form" class="modal-body">
          <div class="form-group">
            <div class="input-label">
              <label for="name">Nama</label>
              <span class="required">*</span>
            </div>
            <input
              name="name"
              type="text"
              id="profile-name"
              placeholder="John Doe"
              autocomplete="name"
            />
          </div>

          <div class="form-group">
            <div class="input-label">
              <label for="email">Email</label>
              <span class="required">*</span>
            </div>
            <input
              name="email"
              type="email"
              id="profile-email"
              placeholder="nama@contoh.com"
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              class="input-data"
              placeholder="••••••••"
              type="password"
            />
          </div>
          <p id="errorMsg" style="color: red"></p>

          <button type="button" class="btn-delete">Hapus Akun</button>
          <button type="submit" class="btn-save">Simpan</button>
        </form>
      </div>
    </div>

    <script src="/static/js/navbar.js"></script>
    <script src="/static/js/result.js"></script>
    <script src="/static/js/menuBottom.js"></script>
    <script src="/static/js/middleware.js"></script>
  </body>
</html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="/static/css/login.css" />
  </head>
  <body class="body-login">
    <!-- TopMenu -->
    <header class="top-menu-container glass-panel">
      <div class="top-menu">
        <h2 class="top-menu-label">Deteksi Sampah</h2>
        <div class="top-menu-list">
          <a class="menu" href="/">Beranda</a>
          <a class="menu" href="/guide">Panduan</a>
          <a class="menu" href="/history">Riwayat Deteksi</a>
        </div>
        <div class="top-menu-right"></div>
      </div>
    </header>
    <!-- Main Content: Registration Canvas -->
    <main class="main-content">
      <div class="content-wrap">
        <!-- Registration Card -->
        <div class="login-card">
          <!-- Subtle Decoration -->
          <div class="sub-deco"></div>
          <div class="login-wrap">
            <h1 class="login-headline">Selamat Datang Kembali</h1>
            <p class="login-description">
              Masukkan kredensial Anda untuk mengakses aplikasi.
            </p>
            <form class="login-form" id="loginForm">
              <!-- Email Address -->
              <div class="input-wrap">
                <label for="email" class="input-label">Alamat Email</label>
                <input
                  id="email"
                  name="email"
                  class="input-data"
                  placeholder="nama@contoh.com"
                  type="email"
                  autocomplete="email"
                />
              </div>
              <div class="input-wrap">
                <label for="password" class="input-label">Kata Sandi</label>
                <input
                  id="password"
                  name="password"
                  class="input-data"
                  placeholder="••••••••"
                  type="password"
                />
              </div>
              <p id="errorMsg" style="color: red"></p>
              <!-- Primary Sign In Button -->
              <button class="button-login" type="submit">Login</button>
            </form>
            <!-- Footer Redirect -->
            <p class="footer-redirect">
              Tidak Memiliki Akun?
              <a class="redirect-login" href="/register">Buat Akun</a>
            </p>
          </div>
        </div>
      </div>
    </main>
    <!-- Footer  -->
    <footer class="footer">
      <div class="footer-wrap">
        <div class="text-footer">© 2026 Deteksi Sampah.</div>
      </div>
    </footer>

    <!-- Mobile Navigation -->
    <nav id="bottomNav" class="bottom-nav">
      <button class="bottom-nav-button" data-url="/">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"

        >
          <path
            fill="currentColor"

          />
        </svg>
        <span class="bottom-nav-text">Beranda</span>
      </button>
      <button class="bottom-nav-button" data-url="/guide">
        <svg
          xmlns="http://www.w3.org/2000/svg"

          />

      <button class="bottom-nav-button" data-url="/history">

          />

        <span class="bottom-nav-text">Riwayat</span>

      <button class="bottom-nav-button register" data-url="/register">
